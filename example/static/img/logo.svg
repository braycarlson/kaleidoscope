<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kaleidoscope">
    <defs>
        <clipPath id="ring">
            <circle cx="32" cy="32" r="30"/>
        </clipPath>
    </defs>

    <g clip-path="url(#ring)">
        <rect width="64" height="64" fill="#14151d"/>

        <g transform="translate(32 32)">
            <g fill="#8b7cf6">
                <polygon points="0,0 30,-14 30,14"/>
                <polygon points="0,0 -15,-27 12,-31" transform="rotate(120)"/>
            </g>

            <g fill="#60bed6" opacity="0.9">
                <polygon points="0,0 30,-14 30,14" transform="rotate(60)"/>
                <polygon points="0,0 -15,-27 12,-31" transform="rotate(180)"/>
            </g>

            <g fill="#f0a5c9" opacity="0.85">
                <polygon points="0,0 30,-14 30,14" transform="rotate(180)"/>
                <polygon points="0,0 -15,-27 12,-31" transform="rotate(300)"/>
            </g>

            <g fill="#f5d377" opacity="0.85">
                <polygon points="0,0 30,-14 30,14" transform="rotate(240)"/>
            </g>

            <circle r="7" fill="#14151d"/>
            <circle r="3.2" fill="#e9e7ff"/>
        </g>
    </g>

    <circle cx="32" cy="32" r="30" fill="none" stroke="#2c2f3d" stroke-width="3"/>
</svg>
