<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ajax</title>
</head>
<body>
    <button id="fetch" type="button">Fetch</button>
    <button id="xhr" type="button">XHR</button>
    <output id="result"></output>
    <script>
        document.getElementById('fetch').addEventListener('click', function () {
            fetch('/work/?queries=3&distinct=1&kind=json&token=fetched').then(function (response) {
                return response.text();
            }).then(function (text) {
                document.getElementById('result').textContent = 'fetch ' + text.length;
            });
        });

        document.getElementById('xhr').addEventListener('click', function () {
            const request = new XMLHttpRequest();

            request.open('GET', '/work/?queries=2&distinct=2&kind=json&token=requested');
            request.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

            request.addEventListener('load', function () {
                document.getElementById('result').textContent = 'xhr ' + request.responseText.length;
            });

            request.send();
        });
    </script>
</body>
</html>
