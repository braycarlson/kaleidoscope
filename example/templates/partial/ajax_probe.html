<div class="card" x-data="bookProbe">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
            <div class="fw-semibold">AJAX request tracking</div>
            <p class="small text-body-secondary mb-0">Calls <code>/api/books/</code>, which runs the same per-row queries and returns JSON. Kaleidoscope keeps the page request and every XHR fired after it.</p>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div class="text-end" x-cloak x-show="requests > 0">
                <div class="demo-numeric fs-5" x-text="count"></div>
                <div class="small text-body-secondary"><span x-text="requests"></span> XHR sent</div>
            </div>

            <button class="btn btn-primary btn-sm text-nowrap" type="button" x-on:click="probe()" x-bind:disabled="loading">
                <span x-show="!loading">Fetch books over XHR</span>
                <span x-cloak x-show="loading">Loading</span>
            </button>
        </div>
    </div>
</div>
