[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0"]

[project]
name = "django-kaleidoscope"
version = "0.0.11"
description = "A debug toolbar for Django."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brayden Carlson", email = "braydencarlson@gmail.com" },
]
keywords = [
    "debug",
    "django",
    "profiling",
    "toolbar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "django>=4.2",
    "line-profiler",
    "pympler>=1.0",
    "pyinstrument>=4.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "playwright",
    "ruff",
    "ty",
]

[project.urls]
Homepage = "https://github.com/braycarlson/kaleidoscope"
Issues = "https://github.com/braycarlson/kaleidoscope/issues"
Repository = "https://github.com/braycarlson/kaleidoscope"

[tool.setuptools.packages.find]
include = ["kaleidoscope*"]

[tool.setuptools.package-data]
kaleidoscope = ["static/kaleidoscope/**/*", "templates/*"]
